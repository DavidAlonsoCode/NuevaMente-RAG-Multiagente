name: Caddy / configuración y proxy

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "infra/caddy/**"
      - "infra/oci/**"
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".env*.example"
      - ".github/scripts/**"
      - ".github/requirements-caddy.*"
      - ".github/workflows/caddy.yml"
      - "requirements-dev.txt"
      - "pytest.ini"
  push:
    branches: [develop, main]
    paths:
      - "infra/caddy/**"
      - "infra/oci/**"
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".env*.example"
      - ".github/scripts/**"
      - ".github/requirements-caddy.*"
      - ".github/workflows/caddy.yml"
      - "requirements-dev.txt"
      - "pytest.ini"

permissions:
  contents: read

concurrency:
  group: caddy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proxy:
    name: Caddy real / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      APP_ENV: ci
      MOCK_OCI: "1"
      MOCK_GEMINI: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias fijadas y herramientas Python verificadas
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nm48-playwright-download
        run: |
          test ! -e "$PLAYWRIGHT_BROWSERS_PATH"
          python -m pip install -r requirements-dev.txt -r backend/requirements.txt -r frontend/requirements.txt
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-caddy.lock
          python .github/scripts/check_pinned_requirements.py .github/requirements-caddy.txt
          python -m playwright install --with-deps chromium
      - name: Caddy y Compose oficiales con versión y digest verificados
        run: python .github/scripts/smoke_caddy.py --prepare-tools "${{ runner.temp }}/caddy-tools"
      - name: Compatibilidad userns del Chromium fijado, solo VM efímera
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nm48-playwright-download
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          # Resolve the pinned default headless shell, never an executable override.
          relative_executable="$(python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          from importlib.resources import files
          try:
              assert not os.environ.get("NM_BROWSER_EXECUTABLE")
              package = files("playwright").joinpath("driver/package/lib/coreBundle.js")
              node = files("playwright").joinpath("driver/node")
              query = "process.stdout.write(require(process.argv[1]).registry.registry.findExecutable('chromium-headless-shell').executablePath())"
              result = subprocess.run([str(node), "-e", query, str(package)],
                                      check=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              executable = Path(os.fsdecode(result.stdout))
              print(executable.relative_to(Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"])).as_posix())
          except Exception:
              print("SANDBOX_CI_RESOLUTION_FAILED", file=sys.stderr)
              sys.exit(1)
          PY
          )"
          # Dedicated fixed locations; refuse pre-existing files, directories or profiles.
          sudo -n /usr/bin/python3 - "$PLAYWRIGHT_BROWSERS_PATH" "$relative_executable" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess
          import sys

          def protected(path):
              info = path.lstat()
              assert not stat.S_ISLNK(info.st_mode)
              assert info.st_uid == info.st_gid == 0 and not info.st_mode & 0o6022

          def inventory(base, verify_protection=False):
              rows = {}
              for path in [base, *sorted(base.rglob("*"))]:
                  info = path.lstat()
                  assert not info.st_mode & 0o6000
                  if verify_protection:
                      protected(path)
                  if stat.S_ISDIR(info.st_mode):
                      value = ["directory"]
                  else:
                      assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1
                      with path.open("rb") as stream:
                          value = ["file", bool(info.st_mode & 0o111),
                                   hashlib.file_digest(stream, "sha256").hexdigest()]
                  rows[path.relative_to(base).as_posix()] = value
              return rows

          def copy_file(source, destination):
              descriptor = os.open(source, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(descriptor, "rb") as incoming, open(destination, "xb") as outgoing:
                  mode = os.fstat(incoming.fileno()).st_mode
                  assert stat.S_ISREG(mode) and not mode & 0o6000
                  shutil.copyfileobj(incoming, outgoing)
                  os.fchmod(outgoing.fileno(), 0o555 if mode & 0o111 else 0o444)

          try:
              assert os.geteuid() == os.getegid() == 0
              source = Path(sys.argv[1])
              relative = Path(sys.argv[2])
              assert not source.is_symlink() and source.is_dir()
              assert not relative.is_absolute() and ".." not in relative.parts
              assert re.fullmatch(r"[A-Za-z0-9_./-]+", relative.as_posix())
              root = Path("/opt/nm48-playwright-ci")
              bundle = root / "browsers"
              profile = Path("/etc/apparmor.d/nm48-chromium-ci")
              for path in [*root.parents, profile.parent, *profile.parent.parents]:
                  protected(path)
              assert not root.exists() and not root.is_symlink()
              assert not profile.exists() and not profile.is_symlink()
              assert Path("/sys/module/apparmor/parameters/enabled").read_text().strip() == "Y"
              loaded = Path("/sys/kernel/security/apparmor/profiles")
              assert not any(line.startswith("nm48-chromium-ci ") for line in loaded.read_text().splitlines())
              before = inventory(source)
              assert before[relative.as_posix()][:2] == ["file", True]
              # New root-owned inodes, not a rename of files the runner may have open.
              root.mkdir(mode=0o700)
              root.chmod(0o700)
              shutil.copytree(source, bundle, symlinks=True, copy_function=copy_file)
              assert inventory(bundle) == before
              for path in [bundle, *bundle.rglob("*")]:
                  mode = path.lstat().st_mode
                  path.chmod(0o555 if stat.S_ISDIR(mode) or mode & 0o111 else 0o444)
              root.chmod(0o755)
              protected(root)
              assert inventory(bundle, verify_protection=True) == before == inventory(source)
              executable = bundle / relative
              policy = 'abi <abi/4.0>,\nprofile nm48-chromium-ci "' + str(executable) + '" flags=(unconfined) {\n  userns,\n}\n'
              with profile.open("x") as stream:
                  stream.write(policy)
              profile.chmod(0o644)
              protected(profile)
              # --add refuses replacement; no global reload, sysctl or setuid helper.
              subprocess.run(["/usr/sbin/apparmor_parser", "--add", "--skip-cache", str(profile)],
                             check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              assert "nm48-chromium-ci (unconfined)" in loaded.read_text().splitlines()
              digest = hashlib.sha256(json.dumps(before, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
              print(json.dumps({"sandbox_ci": "prepared", "bundle_manifest_sha256": digest}))
          except Exception:
              print("SANDBOX_CI_PREPARATION_FAILED", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Sintaxis de wrappers y smoke requerido, sin skips
        env:
          CADDY_BIN: ${{ runner.temp }}/caddy-tools/caddy
          COMPOSE_BIN: ${{ runner.temp }}/caddy-tools/docker-compose
          PLAYWRIGHT_BROWSERS_PATH: /opt/nm48-playwright-ci/browsers
        run: |
          test -z "${NM_BROWSER_EXECUTABLE:-}"
          bash -n infra/caddy/install.sh
          bash -n infra/caddy/deploy.sh
          python -m py_compile .github/scripts/smoke_caddy.py backend/tests/integration/caddy_backend.py backend/tests/integration/caddy_browser.py
          python .github/scripts/smoke_caddy.py
      - name: Evidencia saneada (sin logs crudos, TLS, tokens ni perfiles)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caddy-${{ matrix.runner }}
          path: |
            .data/caddy-evidence/observations.json
            .data/caddy-evidence/required-tests.xml
          if-no-files-found: error
          retention-days: 14
