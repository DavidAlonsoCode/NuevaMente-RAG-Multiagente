# =============================================================================
# Configuracion de pytest (issue #02): "configurar imports para ejecutar
# pytest desde la raiz". Este archivo vive en la raiz del repo, y pytest lo
# detecta al arrancar; a partir de ahi, el comando es siempre `pytest`
# parado en la raiz — exactamente lo que hace la CI (paso "Tests" de
# .github/workflows/ci.yml) y lo que debe hacer cada dev antes de un push.
# =============================================================================

[pytest]
testpaths = backend/tests
pythonpath = backend backend/tests

# Marcas de pytest (se registran aqui para que usarlas sea libre de warnings;
# el issue #10 las hace obligatorias en la seleccion de CI):
#   unit             -> rapidas, sin IO externo.
#   integration_mock -> flujos completos con dependencias simuladas.
#   integration_real -> toca OCI/Gemini REALES; jamas en CI (issue #54).
markers =
    unit: pruebas rapidas sin IO externo (infraestructura del issue #10)
    integration_mock: integracion con dependencias simuladas (issue #10)
    integration_real: integracion real con OCI/Gemini; excluida de CI (issue #54)
    e2e: criterios extremo a extremo; combinar con integration_mock o integration_real segun dependencias
    caddy_proxy: Caddy/TCP/TLS/React reales, proveedores simulados; seleccion explicita obligatoria

# pytest-asyncio en modo automatico: cualquier test `async def` corre en el
# bucle de eventos sin decoradores extra (issue #10).
asyncio_mode = auto

# Seleccion por defecto (criterio 1 del issue #10): la suite ordinaria corre
# solo unit + integration_mock — sin red ni credenciales. integration_real
# queda excluida SIEMPRE de la corrida normal (se ejecuta aparte, issue #54).
addopts = -m "unit or integration_mock"
