[Service]
User=caddy
Group=caddy
EnvironmentFile=/etc/caddy/caddy.env
EnvironmentFile=/etc/nuevamente/secrets/origin.env
Environment=HOME=/var/lib/caddy XDG_DATA_HOME=/var/lib/caddy XDG_CONFIG_HOME=/var/lib/caddy
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
StateDirectory=caddy
StateDirectoryMode=0700
LogsDirectory=caddy
LogsDirectoryMode=0750
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=full
ProtectHome=true
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE
# Native Caddy validation does not check environment syntax. Fail without values in diagnostics.
ExecStartPre=
ExecStartPre=/usr/bin/python3 -c "import os,re,sys; d=os.environ.get('NUEVAMENTE_DOMAIN',''); s=os.environ.get('TRUSTED_ORIGIN_SECRET',''); valid=len(d)<=253 and not d.endswith(('.localhost','.local','.internal','.home.arpa')) and re.fullmatch(r'(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?[.])+[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?',d) and re.fullmatch(r'[0-9a-f]{64}',s) and os.environ.get('CADDY_STORAGE_DIR')=='/var/lib/caddy' and os.environ.get('CADDY_LOG_DIR')=='/var/log/caddy'; sys.exit(0 if valid else 'Invalid Caddy production environment; check hostname, origin secret and paths')"
ExecStartPre=/usr/bin/python3 -c "import subprocess,sys; v=subprocess.check_output(['/usr/bin/caddy','version'],text=True).split()[0]; sys.exit(0 if v=='v2.11.7' else 'Caddy 2.11.7 required')"
ExecStartPre=/usr/bin/python3 -I /usr/local/lib/nuevamente/verify_deployment.py caddy-validate
ExecStart=
ExecStart=/usr/bin/python3 -I /usr/local/lib/nuevamente/verify_deployment.py caddy-run
ExecReload=
# Reuse the same guard for reload, then validate before submitting atomically.
ExecReload=/usr/bin/python3 -c "import os,re,sys; d=os.environ.get('NUEVAMENTE_DOMAIN',''); s=os.environ.get('TRUSTED_ORIGIN_SECRET',''); valid=len(d)<=253 and not d.endswith(('.localhost','.local','.internal','.home.arpa')) and re.fullmatch(r'(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?[.])+[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?',d) and re.fullmatch(r'[0-9a-f]{64}',s) and os.environ.get('CADDY_STORAGE_DIR')=='/var/lib/caddy' and os.environ.get('CADDY_LOG_DIR')=='/var/log/caddy'; sys.exit(0 if valid else 'Invalid Caddy production environment; check hostname, origin secret and paths')"
ExecReload=/usr/bin/python3 -c "import subprocess,sys; v=subprocess.check_output(['/usr/bin/caddy','version'],text=True).split()[0]; sys.exit(0 if v=='v2.11.7' else 'Caddy 2.11.7 required')"
ExecReload=/usr/bin/python3 -I /usr/local/lib/nuevamente/verify_deployment.py caddy-reload
